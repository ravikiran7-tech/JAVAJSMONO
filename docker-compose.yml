version: "3.9"

services:
  react-nextjs-host:
    image: react-nextjs-host:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: react-nextjs-host
    ports:
      - "8080:8080"
    environment:
      - TZ=UTC
      - JAVA_OPTS=-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0 -Xms256m -Xmx512m
    restart: unless-stopped
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
