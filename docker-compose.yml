version: '3.8'

services:
  react-nextjs-host:
    build:
      context: .
      dockerfile: Dockerfile
    image: react-nextjs-host:latest
    container_name: react-nextjs-host
    ports:
      - "8080:8080"
    environment:
      - JAVA_OPTS=-Xmx512m -Xms256m
    restart: unless-stopped
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
