version: "3.9"

services:
  react-nextjs-host:
    image: react-nextjs-host:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: react-nextjs-host
    ports:
      - "8080:8080"
    environment:
      - TZ=UTC
      - JAVA_OPTS=-Xmx512m -Xms256m -XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0
    networks:
      - app-network
    restart: unless-stopped

networks:
  app-network:
    driver: bridge
