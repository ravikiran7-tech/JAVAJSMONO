version: '3.8'

services:
  react-nextjs-host:
    build:
      context: .
      dockerfile: Dockerfile
    image: react-nextjs-host:latest
    container_name: react-nextjs-host
    ports:
      - "8080:8080"
    environment:
      # Server configuration
      - SERVER_PORT=8080
      
      # Frontend runtime configuration
      - API_URL=${API_URL:-http://localhost:8080}
      - BACKEND_URL=${BACKEND_URL:-http://localhost:8080}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME:-}
      - FEATURE_FLAG=${FEATURE_FLAG:-false}
      
      # Redis configuration (external service)
      - REDIS_HOST=${REDIS_HOST:-redis.example.com}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      
      # AWS S3 configuration (external service)
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      
      # JVM options
      - JAVA_OPTS=-Xmx512m -Xms256m -XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "java", "-cp", "app.jar", "com.trianz.reactnextjs.HealthCheck"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 40s

networks:
  app-network:
    driver: bridge
