apiVersion: v1
kind: Service
metadata:
  name: react-nextjs-host-service
  namespace: react-nextjs-host
  labels:
    app: react-nextjs-host
    app.kubernetes.io/name: react-nextjs-host
    app.kubernetes.io/managed-by: kubectl
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP
  selector:
    app: react-nextjs-host
