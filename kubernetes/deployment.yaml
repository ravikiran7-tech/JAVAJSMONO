apiVersion: apps/v1
kind: Deployment
metadata:
  name: react-nextjs-host
  namespace: react-nextjs-host
  labels:
    app: react-nextjs-host
    version: "1.0.0"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: react-nextjs-host
  template:
    metadata:
      labels:
        app: react-nextjs-host
        version: "1.0.0"
    spec:
      containers:
        - name: react-nextjs-host
          image: {{IMAGE_URI}}
          ports:
            - containerPort: 8080
              protocol: TCP
          env:
            - name: TZ
              value: "UTC"
            - name: JAVA_OPTS
              value: "-Xmx512m -Xms256m -XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0"
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
      restartPolicy: Always
