apiVersion: apps/v1
kind: Deployment
metadata:
  name: react-nextjs-host
  namespace: react-nextjs-host
  labels:
    app: react-nextjs-host
    version: v1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: react-nextjs-host
  template:
    metadata:
      labels:
        app: react-nextjs-host
        version: v1
    spec:
      containers:
      - name: react-nextjs-host
        image: {{IMAGE_URI}}
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        env:
        - name: JAVA_OPTS
          value: "-Xmx512m -Xms256m -XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0"
        - name: TZ
          value: "UTC"
        resources:
          requests:
            cpu: "250m"
            memory: "512Mi"
          limits:
            cpu: "500m"
            memory: "1Gi"
        livenessProbe:
          httpGet:
            path: /api/health
            port: 8080
            scheme: HTTP
          initialDelaySeconds: 60
          periodSeconds: 10
          timeoutSeconds: 5
          successThreshold: 1
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /api/health
            port: 8080
            scheme: HTTP
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          successThreshold: 1
          failureThreshold: 3
      restartPolicy: Always
